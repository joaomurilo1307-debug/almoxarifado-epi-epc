services:
  app:
    image: ghcr.io/joaomurilo1307-debug/almoxarifado-epi-epc:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://${APP_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_DOMAIN: ${APP_DOMAIN}
      RUN_SEED: ${RUN_SEED}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.almoxarifado-epi-epc.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.almoxarifado-epi-epc.entrypoints=websecure"
      - "traefik.http.routers.almoxarifado-epi-epc.tls.certresolver=letsencrypt"
      - "traefik.http.services.almoxarifado-epi-epc.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
